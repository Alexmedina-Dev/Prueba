<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>MotoVerso — Panel de Errores</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #0f1115; color: #e4e6eb; padding: 20px; }
  h1 { font-size: 20px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
  .nav-buttons { display: flex; gap: 8px; }
  .nav-buttons a { text-decoration: none; }
  .btn-back { background: #2e7d32; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; }
  .btn-back:hover { background: #1b5e20; }
  .btn-logout { background: #c62828; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; }
  .btn-logout:hover { background: #b71c1c; }
  .stats { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .stat-card { background: #1a1d24; border-radius: 8px; padding: 12px 16px; min-width: 140px; }
  .stat-card .num { font-size: 22px; font-weight: 700; }
  .stat-card .label { font-size: 12px; color: #8a8f99; }
  .filters { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  select, input, button { background: #1a1d24; border: 1px solid #2a2e38; color: #e4e6eb; padding: 8px 10px; border-radius: 6px; font-size: 14px; }
  button { cursor: pointer; }
  button:hover { background: #2a2e38; }
  table { width: 100%; border-collapse: collapse; background: #1a1d24; border-radius: 8px; overflow: hidden; }
  th, td { text-align: left; padding: 10px 12px; font-size: 13px; border-bottom: 1px solid #2a2e38; }
  th { color: #8a8f99; font-weight: 600; }
  tr:hover { background: #21252e; cursor: pointer; }
  .badge { padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
  .badge-server { background: #4a1a1a; color: #ff6b6b; }
  .badge-client { background: #4a3a1a; color: #ffb86b; }
  .badge-unhandled { background: #3a1a4a; color: #c96bff; }
  .badge-fatal { background: #6b0000; color: #fff; }
  
  /* Severidad */
  .badge-critical { background: #6b0000; color: #fff; }
  .badge-high { background: #8b4513; color: #ffb86b; }
  .badge-medium { background: #4a4a1a; color: #ffd700; }
  .badge-low { background: #1a4a1a; color: #4caf50; }
  
  /* Filas por severidad */
  .severity-critical { border-left: 4px solid #ff0000; }
  .severity-high { border-left: 4px solid #ff8c00; }
  .severity-medium { border-left: 4px solid #ffd700; }
  .severity-low { border-left: 4px solid #4caf50; }
  .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6); align-items: center; justify-content: center; z-index: 10; }
  .modal.open { display: flex; }
  .modal-box { background: #1a1d24; border-radius: 10px; padding: 20px; max-width: 700px; width: 90%; max-height: 80vh; overflow-y: auto; }
  .modal-box pre { background: #0f1115; padding: 12px; border-radius: 6px; overflow-x: auto; font-size: 12px; white-space: pre-wrap; word-break: break-word; }
  .pagination { display: flex; gap: 8px; margin-top: 16px; align-items: center; }
  #empty { text-align: center; padding: 30px; color: #8a8f99; }
</style>
</head>
<body>
  <h1>
    🔧 MotoVerso — Panel de Errores
    <div class="nav-buttons">
      <button class="btn-back" onclick="window.location.href='/APP/app.html'">← Volver a App</button>
      <button class="btn-logout" onclick="cerrarSesion()">Cerrar Sesión</button>
    </div>
  </h1>

  <div class="stats" id="stats"></div>

  <div class="filters">
    <select id="filtroTipo">
      <option value="">Todos los tipos</option>
      <option value="ERROR_SERVER">ERROR_SERVER</option>
      <option value="ERROR_CLIENT">ERROR_CLIENT</option>
      <option value="ERROR_CLIENT_DETAIL">ERROR_CLIENT_DETAIL (con stack trace)</option>
      <option value="ERROR_UNHANDLED">ERROR_UNHANDLED</option>
      <option value="UNCAUGHT_EXCEPTION">UNCAUGHT_EXCEPTION</option>
      <option value="UNHANDLED_REJECTION">UNHANDLED_REJECTION</option>
    </select>
    <input type="text" id="filtroRuta" placeholder="Filtrar por ruta (ej: servicios)">
    <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:13px;color:#8a8f99;">
      <input type="checkbox" id="ocultarAutofix" checked> Ocultar auto-resueltos
    </label>
    <button onclick="cargarLogs(1)">Filtrar</button>
    <button onclick="autoRefresh()">🔄 Auto-refrescar: <span id="refreshState">OFF</span></button>
  </div>

  <table>
    <thead>
      <tr><th>Fecha</th><th>Severidad</th><th>Tipo</th><th>Ruta</th><th>Mensaje</th><th>Usuario</th></tr>
    </thead>
    <tbody id="tablaLogs"></tbody>
  </table>
  <div id="empty" style="display:none">No hay errores registrados con este filtro 🎉</div>

  <div class="pagination">
    <button onclick="cambiarPagina(-1)">‹ Anterior</button>
    <span id="paginaInfo"></span>
    <button onclick="cambiarPagina(1)">Siguiente ›</button>
  </div>

  <div class="modal" id="modal">
    <div class="modal-box">
      <h3 id="modalTitulo"></h3>
      <p id="modalMeta" style="color:#8a8f99;font-size:13px;margin:8px 0"></p>
      <p id="modalSeveridad" style="color:#ffb86b;font-weight:600;margin:8px 0"></p>
      <p id="modalAutofix" style="display:none;color:#4caf50;font-weight:600;margin:8px 0;padding:8px;background:#1a3a1a;border-radius:6px;border-left:3px solid #4caf50;"></p>
      
      <div class="sugerencia-box" style="background:#1a3a1a;border-left:3px solid #4caf50;padding:12px;margin:12px 0;border-radius:6px;">
        <p style="color:#4caf50;font-weight:600;margin:0 0 4px 0">💡 Sugerencia de solución:</p>
        <pre id="modalSugerencia" style="margin:0;color:#e4e6eb;background:transparent;padding:0;"></pre>
      </div>
      
      <p><strong>Mensaje:</strong></p>
      <pre id="modalMensaje"></pre>
      <p><strong>Stack trace:</strong></p>
      <pre id="modalStack"></pre>
      <p><strong>Datos de la petición:</strong></p>
      <pre id="modalDatos"></pre>
      <button onclick="cerrarModal()">Cerrar</button>
    </div>
  </div>

  <script src="/ADMIN/logs-client.js"></script>
</body>
</html>
